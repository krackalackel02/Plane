name: Verify PR

on:
  pull_request:
    # Run for any pull request into any branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped to this PR/ref, not shared with the "pages" deploy pipeline in
  # main.yaml — PR checks never touch Pages, so they shouldn't queue
  # behind (or block) deploys or other PRs' checks. A new push cancels
  # the previous run for the same ref instead of wasting a queue slot.
  group: verify-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job: standalone install check. Nothing has `needs: install` — this
  # exists purely so a broken `npm ci` (bad lockfile, registry outage,
  # etc.) shows up as one clearly-red job at a glance, instead of you
  # having to open test/e2e/build individually and notice they all died
  # on the same step. test/e2e/build each still run their own npm ci in
  # parallel, so this job doesn't gate or slow anything down.
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  # Job: Unit tests (no dependency on e2e/build — starts immediately)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest --run

  # Job: End-to-end tests (real mobile-device emulation: touch controls).
  # Runs in parallel with test/build — no dependency between them.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Job: Build (verifies the app actually builds; PRs don't deploy).
  # Doesn't consume test/e2e output, so it runs in parallel with them
  # instead of waiting — a failing build shows up just as fast as a
  # failing test.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project with Npx Vite
        env:
          VITE_SHOW_STATS: ${{ secrets.VITE_SHOW_STATS}}
          VITE_SHOW_CAMERA: ${{ secrets.VITE_SHOW_CAMERA}}
          VITE_SHOW_SHIP: ${{ secrets.VITE_SHOW_SHIP}}
        run: npm run build

      - name: Check bundle size budget
        run: npm run perf:bundle-size
