name: Deploy Npx Vite to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job: standalone install check, purely for a clear pass/fail signal.
  # Nothing has `needs: install` — test/e2e/build each still run their
  # own npm ci in parallel, so this doesn't gate or slow anything down.
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  # Job: Unit tests. Runs in parallel with e2e/build — no shared install
  # job to wait on.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest --run

  # Job: builds the app once with the e2e test hooks enabled (see
  # src/utils/e2eTestHooks.ts), so the 4 e2e shards below don't each
  # redundantly rebuild it themselves.
  build-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build app with e2e test hooks enabled
        run: npm run build:e2e

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: dist/
          retention-days: 1

  # Job: End-to-end tests (real mobile-device emulation: touch controls).
  # Runs in parallel with test/build.
  #
  # Sharded across 4 runners instead of one, each running multiple
  # Playwright workers (see playwright.config.ts). Runs against the
  # build-e2e artifact via `vite preview` (static files) rather than the
  # dev server — concurrent contexts against the dev server raced its
  # on-demand module compilation and caused real flakiness, which static
  # preview can't hit. `needs: e2e` further down waits for every shard,
  # not just one.
  e2e:
    needs: build-e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: dist/

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run e2e tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Job: Build the deploy artifact. Doesn't consume test/e2e output, so
  # it runs in parallel with them too — only `deploy` actually waits on
  # tests passing before anything goes live.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project with Npx Vite
        env:
          VITE_SHOW_STATS: ${{ secrets.VITE_SHOW_STATS}}
          VITE_SHOW_CAMERA: ${{ secrets.VITE_SHOW_CAMERA}}
          VITE_SHOW_SHIP: ${{ secrets.VITE_SHOW_SHIP}}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Job: Deploy. Gated on test + e2e + build all succeeding — this is the
  # only place that still waits, since it's the only step with real
  # consequences (production).
  deploy:
    needs: [test, e2e, build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
